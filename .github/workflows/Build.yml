name: Build APK

# 推送到 main/master 自动触发；也可在 Actions 页面手动 Run workflow
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 17

      # setup-android 会：安装 cmdline-tools、导出 ANDROID_HOME、
      # 并通过 packages 输入自动安装所需组件并静默接受 license。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # 打印仓库树，便于确认工程是否被多套了一层目录
      - name: Show repo layout
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          find "$GITHUB_WORKSPACE" -maxdepth 4 -not -path '*/.git/*' | sort | head -200

      # 自动定位包含 settings.gradle 的工程根目录，兼容「被套一层」的仓库结构。
      # 排除 .github（那里的 settings.gradle 是误放，不是真正的工程）。
      - name: Locate Gradle project root
        run: |
          ROOT="$(dirname "$(find "$GITHUB_WORKSPACE" -maxdepth 5 -name settings.gradle -not -path '*/.git/*' -not -path '*/.github/*' | head -1)")"
          if [ -z "$ROOT" ] || [ "$ROOT" = "." ]; then
            echo "ERROR: 未在仓库中找到 settings.gradle（.github 下的不算）。工程文件很可能没被 push 到仓库根目录。"
            exit 1
          fi
          echo "GRADLE_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Gradle project root = $ROOT"

      # 让 Gradle 能找到 SDK：local.properties 必须写在工程根目录（即 settings.gradle 所在处）。
      - name: Write local.properties (SDK location)
        run: |
          if [ -z "$ANDROID_HOME" ] && [ -n "$ANDROID_SDK_ROOT" ]; then
            ANDROID_HOME="$ANDROID_SDK_ROOT"
          fi
          if [ -z "$ANDROID_HOME" ]; then
            for p in "$HOME/Android/Sdk" "$HOME/Library/Android/sdk" "$HOME/.android/sdk" /usr/local/lib/android/sdk; do
              if [ -d "$p" ]; then ANDROID_HOME="$p"; break; fi
            done
          fi
          echo "Using ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-34" && echo "platform android-34 OK" || echo "MISSING platform android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0" && echo "build-tools 34.0.0 OK" || echo "MISSING build-tools 34.0.0"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > "$GRADLE_ROOT/local.properties"
          echo "--- local.properties ---"
          cat "$GRADLE_ROOT/local.properties"

      # 用独立 Gradle 8.4（与 gradle-wrapper.properties 一致），避免依赖 wrapper jar。
      - name: Install Gradle 8.4
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.4-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$(pwd)/gradle-8.4/bin" >> "$GITHUB_PATH"

      - name: Gradle version check
        run: gradle --version

      # Chaquopy 的 pip 块需要构建机上有与 app 匹配的 Python（3.12）。
      - name: Check build Python (needed by Chaquopy pip)
        run: |
          python3.12 --version || true
          python3 --version || true

      # 构建 APK：仓库根存在 upload-keystore.jks 则打「已签名的 release 包」
      # （私有签名不会被 Play Protect 当风险应用删除，可正常点按安装）；否则退回 debug 包。
      # 失败时把「FAILURE / What went wrong」块重新打印到日志末尾，方便只截屏底部也能看到报错。
      - name: Build APK
        run: |
          set +e
          if [ -f "$GRADLE_ROOT/upload-keystore.jks" ]; then
            echo "[sign] keystore found -> building SIGNED release"
            TASK=assembleRelease
          else
            echo "[sign] no keystore in repo -> building debug (unsigned)"
            TASK=assembleDebug
          fi
          gradle -p "$GRADLE_ROOT" $TASK --no-daemon --stacktrace > build.log 2>&1
          rc=$?
          echo "===== FULL GRADLE LOG ====="
          cat build.log
          if [ "$rc" -ne 0 ]; then
            echo ""
            echo "########## KEY ERROR (re-printed at end for visibility) ##########"
            awk '/^FAILURE: Build failed/{p=1} p' build.log | head -80
            echo "########## END KEY ERROR ##########"
          fi
          exit "$rc"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: TwinCAT2Login-apk
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
